# Fails a pull request that adds a dependency with a license outside the allow-list, or with a known
# vulnerability. Policy: .github/dependency-review-config.yml (see docs/THIRD_PARTY.md).
# Free on public repositories; private ones need GitHub Advanced Security, so the job is skipped
# there (it then reports as passing). Python packages are also checked by `just licenses`, part of
# `just check`, which runs locally and on private repositories too.
name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    # Job name usable as a required status check: setup-github.sh <mode> dependency-review
    name: dependency-review
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/dependency-review-action@v5
        with:
          config-file: ./.github/dependency-review-config.yml
