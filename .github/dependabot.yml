# Weekly, grouped updates: one PR per ecosystem instead of one per package.
# The stacks/* entries keep the template's packs and their dev containers current; /init-project
# replaces them with one entry per stack directory of the project ("/" for a single stack).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: uv
    directory: /stacks/python
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: build

  - package-ecosystem: npm
    directory: /stacks/typescript
    schedule:
      interval: weekly
    groups:
      typescript:
        patterns: ["*"]
    ignore:
      # Node types must match the runtime in .nvmrc (Node 24 LTS). Newer types would accept APIs
      # that fail at runtime. Bump .nvmrc, "engines" and @types/node together, by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: build

  # Dev container features, pinned in each .devcontainer/devcontainer-lock.json.
  - package-ecosystem: devcontainers
    directories: [/stacks/python, /stacks/typescript]
    schedule:
      interval: weekly
    groups:
      devcontainers:
        patterns: ["*"]
    commit-message:
      prefix: build
