# Weekly, grouped updates: one PR per ecosystem instead of one per package.
# The stacks/* entries keep the template's packs current; /init-project replaces them with a single
# entry for the project's own ecosystem at the repository root.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: uv
    directory: /stacks/python
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: build

  - package-ecosystem: npm
    directory: /stacks/typescript
    schedule:
      interval: weekly
    groups:
      typescript:
        patterns: ["*"]
    ignore:
      # Node types must match the runtime in .nvmrc (Node 24 LTS). Newer types would accept APIs
      # that fail at runtime. Bump .nvmrc, "engines" and @types/node together, by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: build
