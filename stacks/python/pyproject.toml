[project]
name = "project-name"
version = "0.1.0"
description = "Project description."
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/project_name"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Rule reference: https://docs.astral.sh/ruff/rules/
select = [
  "E", "W", # pycodestyle
  "F",      # pyflakes
  "I",      # import order
  "N",      # PEP 8 naming
  "B",      # likely bugs
  "UP",     # modern syntax
  "SIM",    # simplifications
  "C4",     # comprehensions
  "RET",    # return statements
  "ARG",    # unused arguments
  "PT",     # pytest style
  "PL",     # pylint subset (complexity, magic values)
  "S",      # security
  "RUF",    # Ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# Plain asserts and literal values are the point of tests.
"tests/**" = ["S101", "PLR2004"]

[tool.pyright]
include = ["src", "scripts", "tests"]
# Lets tests import the tooling scripts (scripts/check_licenses.py) by module name. Setting
# extraPaths stops Pyright from adding src/ on its own, so it is listed too.
extraPaths = ["src", "scripts"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = [
  "--import-mode=importlib",
  "--strict-markers",
  "--cov=project_name",
  "--cov-report=term-missing",
  "--cov-fail-under=80",
]

[tool.coverage.run]
branch = true

[dependency-groups]
dev = [
    "packaging>=24.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]
